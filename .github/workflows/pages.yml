# Publishes the engine log and the knowledge base to GitHub Pages every time fuel-log-app changes.
# One branch only: the knowledge base app saves its edits to the branch the site was built from, so two
# publishing branches would split the files between them. (If the work moves to main, change it here.)
# Needs Settings → Pages → Source: GitHub Actions.
name: Publish engine log site
on:
  push:
    branches: [fuel-log-app]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      # Until Settings → Pages → Source is "GitHub Actions", GitHub also publishes the raw branch on every
      # push, and whichever finishes last is what the site shows. Wait for that one so this one lands last.
      - name: Wait for GitHub's own branch publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            left=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            [ "$left" = "0" ] && break
            echo "waiting for the branch publish ($i)"; sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
